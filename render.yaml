services:
  - type: web
    name: e-consumption-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-consumption-postgres
          property: connectionString
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: DEFAULT_CUTOFF_TIME
        value: "11:00"
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: e-consumption-postgres
    databaseName: wind_procurement
    user: postgres
    plan: free
